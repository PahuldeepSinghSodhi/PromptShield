[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.1.0"
description = "ML gateway that detects and redacts PII and secrets before prompts reach an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "pyyaml>=6",
    "faker>=25",
    "datasets>=2.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "joblib>=1.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.42",
    "onnx>=1.16",
    "seqeval>=1.2",
    "mlflow>=2.14",
    "prefect>=3.0",
]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "locust>=2.29",
    "dvc>=3.50",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is the framework's idiom

[tool.ruff.lint.per-file-ignores]
# data tables (generator templates, notebook source) read better unwrapped
"src/promptshield/data/synth.py" = ["E501"]
"scripts/make_notebooks.py" = ["E501"]
"load_tests/locustfile.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that need trained model artifacts (skipped when artifacts are missing)",
    "integration: tests that need a running docker-compose stack",
]
