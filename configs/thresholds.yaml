# Regression gate for promoting a retrained model. Values are set after the first
# real training run (see reports/) with a small safety margin below what we measured.
# First full run measured: NER seqeval F1 0.897 / span F1 0.890, secret P 1.00 R 1.00 (test),
# ONNX INT8 p95 11.4 ms. Gates sit a little below those.
gate:
  min_ner_f1: 0.87
  min_secret_precision: 0.97
  min_secret_recall: 0.95
  max_p95_ms: 30          # ONNX INT8, single short prompt, 4 CPU threads
  max_f1_drop_vs_current: 0.01

drift:
  psi_moderate: 0.10
  psi_significant: 0.25
